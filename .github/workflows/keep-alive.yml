name: Keep Render backend awake

# Pings the deployed backend's /health endpoint every 10 minutes so Render's
# free tier (which spins a service down after 15 min of no inbound traffic)
# never gets a big enough gap to sleep. 10 min leaves a safety buffer since
# GitHub's scheduler doesn't guarantee exact timing under load.
#
# One-time setup:
#   1. Deploy the backend to Render, copy its base URL
#      (e.g. https://reviveo-backend.onrender.com)
#   2. In this GitHub repo: Settings -> Secrets and variables -> Actions
#      -> New repository secret
#        Name:  RENDER_HEALTH_URL
#        Value: https://reviveo-backend.onrender.com/health
#   3. Commit + push this file. It starts running on the next scheduled tick,
#      or trigger it immediately from the Actions tab ("Run workflow").

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          if [ -z "${{ secrets.RENDER_HEALTH_URL }}" ]; then
            echo "RENDER_HEALTH_URL secret is not set yet -- add it in repo Settings > Secrets and variables > Actions."
            exit 0
          fi
          # Render free-tier cold starts routinely exceed 25s, so a single
          # short curl times out (exit 28) and `bash -e` fails the whole
          # step before any handling runs. Instead: generous per-attempt
          # timeout, retries with backoff, and curl failures captured as
          # "000" rather than fatal. The step always exits 0 — a pinger
          # going red carries no signal; the next tick retries in 10 min.
          status="000"
          for attempt in 1 2 3; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
              "${{ secrets.RENDER_HEALTH_URL }}" || echo "000")
            echo "Attempt $attempt: HTTP $status"
            if [ "$status" = "200" ]; then
              break
            fi
            sleep 20
          done
          echo "Health endpoint final status: HTTP $status"
          if [ "$status" != "200" ]; then
            echo "Backend may be cold-starting or down -- routine on the free tier, next tick retries."
          fi
          exit 0
